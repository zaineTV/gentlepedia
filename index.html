<!DOCTYPE html>
<html lang="fr" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gentlepedia — Gentle Mates</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--bg2:#131316;--bg3:#1b1b20;--line:#26262c;--tx:#f4f4f6;--mu:#8b8b95;--ac:#d77bf0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:76px 1fr;min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0;border-right:1px solid var(--line);overflow-y:auto}
.logo{width:44px;height:44px;flex:none}
.g{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;color:#0b0b0d;font-size:15px;transition:transform .15s,box-shadow .15s}
.g:hover{transform:scale(1.07)}
.g.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.sep{width:30px;height:1px;background:var(--line);flex:none}
main{min-width:0;padding:0 24px 48px}
header.top{display:flex;align-items:center;gap:16px;padding:14px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;flex-wrap:wrap}
.club{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:14px}
.club b{color:var(--tx);font-weight:600}
.club i{width:34px;height:34px;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:var(--tx)}
nav{display:flex;gap:4px;margin:0 auto}
nav button{padding:8px 12px;border-radius:10px;color:var(--mu);font-size:14px}
nav button:hover,nav button.on{background:var(--bg2);color:var(--tx)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:260px;max-width:100%}
.search input{background:none;border:0;color:var(--tx);font:inherit;flex:1;min-width:0;outline:0}
.search kbd{background:var(--bg3);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--mu)}
.wrap{max-width:1180px;margin:0 auto}
h2{font-size:19px;margin:30px 0 14px;font-weight:700;display:flex;align-items:center;gap:12px}
h2 a{margin-left:auto;font-size:12px;font-weight:500;color:var(--mu);background:var(--bg2);padding:6px 12px;border-radius:8px;cursor:pointer}
.hero{background:var(--bg2);border-radius:18px;padding:34px 20px;text-align:center;overflow:hidden;position:relative}
.hero::before,.hero::after{content:"";position:absolute;top:18%;width:22%;height:90%;background:var(--bg3);border-radius:12px;opacity:.7}
.hero::before{left:-3%;transform:rotate(-8deg)}.hero::after{right:-3%;transform:rotate(8deg)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:6px 0 8px;font-size:clamp(34px,6vw,60px);font-weight:900;letter-spacing:-.04em;display:flex;gap:14px;align-items:center;justify-content:center}
.hero p{margin:0;font-size:18px;font-weight:600}
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card .img{aspect-ratio:16/9;border-radius:14px;position:relative;overflow:hidden}
.card .img em{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:12px;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:8px}
.card .img span{position:absolute;right:8px;bottom:8px;font-size:12px;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:8px}
.card h3{margin:10px 0 2px;font-size:16px}
.card p{margin:0;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rosters{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.rc{aspect-ratio:3/5;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:14px 8px;color:#0b0b0d;font-weight:700;text-align:center;position:relative;overflow:hidden;transition:transform .15s}
.rc:hover{transform:translateY(-3px)}
.rc::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 55%,rgba(0,0,0,.25))}
.rc>*{position:relative}
.rc b{font-size:34px;opacity:.55;margin-bottom:6px}
.bday{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.bd{background:var(--bg2);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-weight:800;flex:none}
.bd small{display:block;color:var(--mu)}
.gp{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
.title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.title h1{margin:0;font-size:22px}
.title h1 span{color:var(--ac)}
.btn{margin-left:auto;background:var(--ac);color:#0b0b0d;font-weight:700;font-size:13px;padding:7px 14px;border-radius:10px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pl{background:var(--bg2);border-radius:16px;padding:8px 8px 12px}
.ph{aspect-ratio:1/1;border-radius:12px;background:radial-gradient(circle at 50% 30%,var(--bg3),var(--bg));position:relative;overflow:hidden}
.ph svg{position:absolute;inset:auto 0 0 0;width:100%;height:80%;fill:var(--line)}
.ph .t{position:absolute;left:8px;top:8px;font-size:12px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:8px;z-index:1}
.ph .age{position:absolute;right:8px;bottom:8px;font-size:20px;font-weight:800;z-index:1}
.pl h4{margin:10px 4px 0;font-size:16px}
.pl h4 small{color:var(--mu);font-weight:400;font-size:12px;margin-left:4px}
.pl p{margin:2px 4px 0;color:var(--mu);font-size:13px}
.pl .r{display:flex;justify-content:space-between;margin:10px 4px 0;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--mu)}
.pl .r b{display:block;color:var(--tx);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:22px;background:var(--bg2);border-radius:14px;padding:14px 18px;margin-top:12px}
.stats div small{display:block;color:var(--mu);font-size:12px}
.stats div b{font-size:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
.tabs button{padding:12px 14px;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--tx);border-color:var(--ac)}
.tabs button sup{font-size:11px;opacity:.7}
.m{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;padding:16px 10px;border-bottom:1px solid var(--line)}
.m .vs{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:800;font-size:20px}
.m .vs span{display:flex;align-items:center;gap:10px;min-width:120px}
.m .vs span:first-child{justify-content:flex-end}
.m .vs i{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;color:#0b0b0d}
.m .bo{font-weight:700}.m small{color:var(--mu);display:block;font-weight:400}
.m .d{text-align:right;color:var(--mu);font-size:13px}
.m .d b{display:inline-block;background:var(--bg3);color:var(--tx);border-radius:8px;padding:2px 10px;font-size:12px;margin-bottom:4px}
.m .d.w b{background:#1f6b3d}.m .d.l b{background:#7a2a2a}
.side h3{margin:0 0 10px;font-size:18px}
.box{background:var(--bg2);border-radius:14px;padding:16px;margin-bottom:22px}
.nm{display:flex;align-items:center;justify-content:space-around;text-align:center;font-size:13px}
.nm .tm{display:grid;gap:6px;justify-items:center}
.nm i{font-style:normal;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#0b0b0d}
.mp{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.mp .mi{height:34px;border-radius:8px;padding:6px 8px;font-weight:700;font-size:13px;color:#fff}
.mp b{font-weight:600}.mp em{font-style:normal;font-size:12px;background:var(--bg3);border-radius:8px;padding:2px 8px}
.empty{background:var(--bg2);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mu)}
.note{margin-top:30px;color:var(--mu);font-size:12px;text-align:center}
@media(max-width:980px){.gp{grid-template-columns:1fr}.news{grid-template-columns:1fr}nav{margin:0}}
@media(max-width:700px){
.app{grid-template-columns:1fr}
aside{position:static;height:auto;flex-direction:row;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.sep{width:1px;height:30px}main{padding:0 14px 40px}.m{grid-template-columns:1fr;text-align:center}.m .d{text-align:center}
.search{width:100%}nav{width:100%;overflow-x:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ed{outline:1px dashed rgba(255,255,255,.28);border-radius:4px;padding:0 3px;min-width:1.5ch;display:inline-block;cursor:text}
.ed:focus{outline:2px solid var(--ac);background:rgba(255,255,255,.08)}
.x{background:#7a2a2a;color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;margin-top:6px}
.add{border:1px dashed var(--mu);color:var(--mu);border-radius:12px;padding:9px 14px;font-size:13px;margin:10px 0}
.add:hover{color:var(--tx);border-color:var(--tx)}
.g.add2{background:var(--bg3);color:var(--tx);font-size:22px}
.cam{position:absolute;left:8px;top:8px;z-index:3;background:var(--ac);color:#0b0b0d;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px}
.card .img .cam{top:8px}
.row{display:flex;gap:8px;align-items:center}
.ed2{color:var(--mu);font-size:13px}
input[type=color]{width:26px;height:22px;padding:0;border:0;background:none;cursor:pointer;vertical-align:middle}
#bar{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu)}
.pb{padding:7px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.pb.pri{background:var(--ac);color:#0b0b0d;font-weight:700;border-color:transparent}
.edit .mp .row{grid-column:1/-1}
.rw{display:flex;flex-direction:column}.rw .rc{width:100%}
.rc.im{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.85)}
.m .vs i.hv,.nm i.hv{width:46px;height:46px;border-radius:0}
.edit .lg{cursor:pointer;outline:1px dashed rgba(255,255,255,.4)}
.tr,.th{display:grid;grid-template-columns:repeat(var(--n),1fr) auto;gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line)}
.th{color:var(--mu);font-size:12px}.tr span{min-width:0;overflow-wrap:anywhere}
@media(max-width:700px){.th{display:none}.tr{grid-template-columns:1fr 1fr}}
input[type=range]{width:90px;accent-color:var(--ac);vertical-align:middle}
.mp .mi{height:46px;display:flex;align-items:center;text-shadow:0 1px 3px rgba(0,0,0,.85)}
.x2{background:var(--ac);color:#0b0b0d;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;margin-top:6px}
/* ===== Refonte visuelle ===== */
*{scrollbar-width:thin;scrollbar-color:#2c2c34 transparent}
body{background:radial-gradient(900px 520px at 85% -8%,color-mix(in srgb,var(--ac) 20%,transparent),transparent),radial-gradient(700px 520px at 0% 105%,color-mix(in srgb,var(--ac) 11%,transparent),transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:1240px}
aside{background:rgba(19,19,22,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.g{border-radius:16px;box-shadow:0 8px 20px -8px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.18)}
.g.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff,0 10px 26px -6px var(--ac)}
header.top{background:rgba(11,11,13,.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05);margin:0 -24px;padding:12px 24px}
nav{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:4px}
nav button{border-radius:10px;transition:background .2s,color .2s}
nav button.on{background:rgba(255,255,255,.11)}
.search{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
h2{font-size:21px;letter-spacing:-.02em;margin:44px 0 16px}
h2 a{border:1px solid rgba(255,255,255,.07);transition:background .2s}h2 a:hover{background:var(--bg3);color:var(--tx)}
.hero{background:radial-gradient(620px 260px at 50% 0%,color-mix(in srgb,var(--ac) 38%,transparent),transparent),linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),var(--bg2);border:1px solid rgba(255,255,255,.09);border-radius:28px;padding:64px 24px;margin-top:8px;box-shadow:0 30px 70px -40px var(--ac)}
.hero::before,.hero::after{opacity:.28;border:1px solid rgba(255,255,255,.1)}
.hero h1{text-shadow:0 6px 40px color-mix(in srgb,var(--ac) 55%,transparent)}
.hero p{color:#d4d4dc;font-weight:500;line-height:1.5}
.card .img{border-radius:20px;box-shadow:0 16px 36px -16px rgba(0,0,0,.8);transition:transform .25s}
.card .img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%);pointer-events:none}
.card .img em,.card .img span{z-index:2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card:hover .img{transform:translateY(-4px)}
.card h3{font-size:17px;letter-spacing:-.02em;margin-top:12px}
.rc{border-radius:22px;box-shadow:0 20px 38px -20px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.22);transition:transform .25s,box-shadow .25s}
.rc:hover{transform:translateY(-6px);box-shadow:0 28px 46px -18px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.35)}
.rc b{font-size:38px;letter-spacing:-.03em}
.bd{border:1px solid rgba(255,255,255,.07);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--bg2)}
.pl{border:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--bg2);border-radius:22px;transition:transform .2s,border-color .2s}
.pl:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 60%,transparent)}
.pl.old{opacity:.72}.pl.old .ph{filter:grayscale(.75)}.pl.old:hover{opacity:1}
h2.oldh{margin:34px 0 14px;font-size:18px;color:var(--mu)}
.ph{border-radius:16px}
.ph .t{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ph .age{text-shadow:0 2px 14px rgba(0,0,0,.85)}
.title h1{font-size:27px;letter-spacing:-.03em}
.btn,.pb.pri{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#fff));box-shadow:0 10px 22px -10px var(--ac)}
.stats{border:1px solid rgba(255,255,255,.07);border-radius:20px;gap:14px 32px;padding:18px 22px}
.stats div b{font-size:23px;letter-spacing:-.02em}
.tabs{border-bottom:0;gap:4px;padding:4px;background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:16px;width:max-content;max-width:100%;margin:20px 0 12px}
.tabs button,.tabs button.on{border:0;border-radius:12px;padding:9px 14px;transition:background .2s,color .2s}
.tabs button.on{background:var(--bg3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.m{margin-top:8px;border:1px solid rgba(255,255,255,.06);border-radius:18px;background:var(--bg2);transition:background .2s}
.m:hover{background:var(--bg3)}
.tr{border:1px solid rgba(255,255,255,.06);border-radius:14px;margin-top:6px;background:var(--bg2)}
.th{border-bottom:0}
.box{border:1px solid rgba(255,255,255,.07);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.045),transparent),var(--bg2);padding:18px}
.side h3{letter-spacing:-.02em}
.mp .mi{border-radius:12px}
.empty{background:transparent;border:1px dashed rgba(255,255,255,.14);border-radius:20px}
.add{border-radius:14px}
@media(max-width:700px){.hero{padding:40px 16px;border-radius:22px}header.top{margin:0 -14px;padding:10px 14px}.tabs{width:auto}}
/* ===== Twitch ===== */
.hm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.rail{position:sticky;top:88px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px;margin-top:8px;background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:26px}
.rail h4{margin:0;font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.tw-it{display:flex;flex-direction:column;align-items:center;gap:4px}
.twb{position:relative;width:50px;height:50px;border-radius:50%;padding:0;border:2px solid #9146ff;overflow:hidden;background:#2a2a32;display:grid;place-items:center;font-weight:800;transition:transform .15s,box-shadow .15s}
.twb:hover{transform:scale(1.1);box-shadow:0 0 0 4px rgba(145,70,255,.35)}
.twb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.edit .rail{width:190px;align-items:stretch}.edit .tw-it{align-items:center}
.twm{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.twm.on{display:flex}
.twp{width:min(1220px,100%);max-height:100%;background:var(--bg2);border:1px solid rgba(255,255,255,.1);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.twh{display:flex;align-items:center;gap:10px;padding:12px 16px}
.twh b{font-size:16px}.twh .sp{flex:1}
.twh a,.twh button{background:var(--bg3);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--tx);text-decoration:none}
.twc{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:min(72vh,660px);background:#000}
.twc iframe{border:0;width:100%;height:100%}
.twn{grid-column:1/-1;padding:28px;color:var(--mu);background:var(--bg2);align-self:center}
@media(max-width:900px){.hm{grid-template-columns:1fr}.rail{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;order:-1;margin-top:0}.edit .rail{width:auto}.twc{grid-template-columns:1fr;height:auto}.twc iframe{height:56vw;min-height:220px}.twc iframe+iframe{height:380px}}
.twb{overflow:visible;border-color:#4a4a55;color:#9a9aa5}
.twb img{border-radius:50%;filter:grayscale(1) brightness(.78);transition:filter .35s}
.twb.live{border-color:#9146ff;color:var(--tx)}
.twb.live img{filter:none}
.twb.live::after{content:"";position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 3px var(--bg2)}
@media(prefers-reduced-motion:reduce){.twb img{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside id="side"></aside>
<main><div class="wrap">
<header class="top">
<div class="club"><i>GM</i><b id="club"></b><span id="crumb"></span></div>
<nav id="nav"></nav>
<label class="search"><span aria-hidden="true">⌕</span><input id="q" placeholder="Rechercher dans : Gentle Mates" aria-label="Rechercher"><kbd>Ctrl K</kbd></label>
<div id="bar"></div>
</header>
<div id="view"></div>
<input type="file" id="file" accept="image/*" hidden="">
<p class="note">Site fan fait en exemple. Les données (joueurs, matchs, stats) sont fictives ou reprises à titre d’illustration.</p>
</div></main>

/* ---------- Accès propriétaire via GitHub ---------- */
var GH={tok:null,owner:null,repo:null,branch:null,path:"index.html"};
function cfg(){var c={};try{c=JSON.parse(localStorage.getItem("gp_cfg")||"{}")}catch(e){}
if(!c.owner&&SRC){var q=SRC.split("/");c.owner=q[0];c.repo=q[1];c.branch=BR}
var h=location.hostname;if(!c.owner&&/\.github\.io$/.test(h)){c.owner=h.split(".")[0];c.repo=location.pathname.split("/")[1]||h}
return c}
async function gh(method,url,body){
var r=await fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+url,{method:method,cache:"no-store",headers:{Authorization:"Bearer "+GH.tok,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined});
var j={};try{j=await r.json()}catch(e){}
if(!r.ok)throw new Error(j.message||("erreur "+r.status));return j}
async function connect(tok,c){
GH.tok=tok;GH.owner=c.owner;GH.repo=c.repo;
var r=await gh("GET","");
GH.branch=c.branch||r.default_branch;c.branch=GH.branch;
try{localStorage.setItem("gp_tok",tok);localStorage.setItem("gp_cfg",JSON.stringify(c))}catch(e){}
CAN=true;bar()}
async function login(){
var c=cfg();
if(!c.owner||!c.repo){var rp=prompt("Ton dépôt GitHub, par exemple : monpseudo/mon-depot\n(tu peux aussi coller son adresse github.com)");if(!rp)return;
var pp=rp.trim().replace(/^https?:\/\//,"").replace(/^(www\.)?github\.com\//,"").replace(/\.git$/,"").split("/").filter(Boolean);
if(pp.length<2){alert("Format attendu : utilisateur/dépôt");return}
c.owner=pp[0];c.repo=pp[1]}
var t=prompt("Colle ton jeton GitHub (il reste uniquement dans ce navigateur) :");if(!t)return;
try{await connect(t.trim(),c)}catch(e){GH.tok=null;alert("Connexion refusée : "+e.message+"\n\nDépôt essayé : "+c.owner+"/"+c.repo+"\n(404 = le jeton n’a pas accès à ce dépôt ; 401 = jeton invalide ou expiré)")}}
function logout(){try{localStorage.removeItem("gp_tok")}catch(e){}GH.tok=null;CAN=false;ED=false;DATA=JSON.parse(SAVED);draw()}
function b64(s){var b=new TextEncoder().encode(s),r="",i=0;for(;i<b.length;i+=32768)r+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(r)}
async function save(){
msg("Enregistrement…");

var cur=await gh("GET","/contents/"+GH.path+"?ref="+encodeURIComponent(GH.branch));
var c=document.documentElement.cloneNode(true);
c.querySelector("#data").textContent=JSON.stringify(DATA).replace(/</g,"\\u003c");
["side","nav","view","bar","crumb","club"].forEach(function(i){c.querySelector("#"+i).innerHTML=""});
c.removeAttribute("style");c.querySelector("body").removeAttribute("class");c.querySelector("#twc").innerHTML="";c.querySelector("#twm").className="twm";
var rs=await gh("PUT","/contents/"+GH.path,{message:"Mise à jour du contenu",content:b64("<!DOCTYPE html>\n"+c.outerHTML),sha:cur.sha,branch:GH.branch});
SAVED=JSON.stringify(DATA);LASTSAVE=Date.now();ED=false;draw();msg("Enregistré ✔ (commit "+((rs.commit&&rs.commit.sha)||"").slice(0,7)+") — visible en ligne dans quelques secondes");
}catch(e){msg("Échec de l’enregistrement : "+e.message)}}
function shrink(f){return new Promise(function(ok,ko){var u=URL.createObjectURL(f),im=new Image();
im.onerror=function(){ko(new Error("image illisible"))};
im.onload=function(){var png=f.type!=="image/jpeg",m=png?700:1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");
c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
c.getContext("2d").drawImage(im,0,0,c.width,c.height);
var d=c.toDataURL(png?"image/png":"image/jpeg",.85);URL.revokeObjectURL(u);
ok({ext:png?"png":"jpg",b64:d.split(",")[1],url:d})};
im.src=u})}
